# Cycle Update Remind - Openclaw 定时任务配置

# 定时任务定义
# 语法：CRON 表达式 → 命令
# 格式：分 时 日 月 星期
# 星期：0=周日, 1=周一, ..., 6=周六

# ========================================
# 10:00 - 每日更新提醒
# ========================================
# 提醒用户更新所有 target benchmark 的进度
0 10 * * *  python .claude/skills/target-benchmark-manage/cli.py check-near-deadline --days 30 >> /tmp/cycle_reminder.log 2>&1

# ========================================
# 14:00 - 每日更新检查（催促）
# ========================================
# 检查 daily benchmarks 是否在当日 23:00 前更新数据
# 如果未更新，发送催促提醒
0 14 * * *  python .claude/skills/status-benchmark-manage/cli.py check-stale --period daily --max-age-hours 12 >> /tmp/cycle_reminder.log 2>&1

# ========================================
# 23:00 - 每日 benchmarks 自动更新
# ========================================
# 自动更新所有 daily status benchmarks 并生成报告
0 23 * * *  python .claude/skills/status-benchmark-manage/cli.py update --period daily --output-report >> /tmp/cycle_reminder.log 2>&1

# ========================================
# 23:00 - 每周 benchmarks 自动更新（周日）
# ========================================
# 每周日 23:00 更新所有 weekly status benchmarks 并生成报告
0 23 * * 0  python .claude/skills/status-benchmark-manage/cli.py update --period weekly --output-report >> /tmp/cycle_reminder.log 2>&1

# ========================================
# 09:00 - 每3天发送状态简报
# ========================================
# 每3天生成并发送所有 benchmarks 的状态简报
# 使用 day-of-month 实现每3天：1,4,7,10,13,16,19,22,25,28
0 9 1,4,7,10,13,16,19,22,25,28 * *  python .claude/skills/status-benchmark-manage/cli.py report >> /tmp/cycle_reminder.log 2>&1
